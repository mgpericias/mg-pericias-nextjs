<style>
:root{
  --grafite:#333433; --cimento:#E4E1DE; --ambar:#C89127;
  --bg:#EDEBE8; --bg2:#FFFFFF; --bg3:#F2F0ED; --line:#D9D5D0;
  --txt:#2A2B2A; --txt2:#5F5E5A; --txt3:#908E89;
  --ok:#2f7d49; --ok-bg:rgba(47,125,73,.12);
  --no:#c0432a; --no-bg:rgba(192,67,42,.10);
  --na:#7a7c7d; --na-bg:rgba(122,124,125,.14);
  --r:14px; --rs:10px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--txt);
  font-size:16px;line-height:1.4;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:16px}
.hidden{display:none!important}

/* ---------- App shell ---------- */
#app{max-width:520px;margin:0 auto;min-height:100%;position:relative;display:flex;flex-direction:column}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(237,235,232,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:calc(var(--safe-t) + 10px) 16px 10px;
  display:flex;align-items:center;gap:10px;min-height:54px;
}
.topbar .back{
  width:38px;height:38px;border-radius:10px;background:var(--bg3);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  font-size:20px;color:var(--txt);transition:background .15s;
}
.topbar .back:active{background:var(--line)}
.topbar .title{flex:1;min-width:0}
.topbar .title h1{font-size:16px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .title .sub{font-size:12px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .act{
  width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  color:var(--ambar);font-size:19px;
}
.topbar .act:active{background:var(--bg3)}

.brandmark{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.topbar-logo{height:30px;width:auto;display:block;max-width:78%}
.brandmark .logo{
  width:34px;height:34px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--ambar),#a9781f);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;color:#1b1c1b;font-size:15px;letter-spacing:-1px;
}
.brandmark .nm{font-size:16px;font-weight:700;letter-spacing:-.3px}
.brandmark .nm small{display:block;font-size:11px;font-weight:500;color:var(--txt2);letter-spacing:.3px;text-transform:uppercase}

/* ---------- Scroll area ---------- */
.screen{flex:1;padding:16px 16px calc(110px + var(--safe-b));animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Cards / lists ---------- */
.section-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--txt3);margin:22px 4px 10px}
.section-label:first-child{margin-top:4px}

.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card + .card{margin-top:12px}

.draft-item{
  display:flex;align-items:center;gap:13px;padding:15px 16px;width:100%;text-align:left;
  border-bottom:1px solid var(--line);background:var(--bg2);transition:background .15s;
}
.draft-item:last-child{border-bottom:none}
.draft-item:active{background:var(--bg3)}
.draft-item .ic{
  width:44px;height:44px;border-radius:11px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:21px;
  background:var(--bg3);
}
.draft-item .ic.done{background:var(--ok-bg);color:var(--ok)}
.draft-item .ic.draft{background:rgba(200,145,39,.16);color:var(--ambar)}
.draft-item .meta{flex:1;min-width:0}
.draft-item .meta .t{font-size:15.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.draft-item .meta .s{font-size:12.5px;color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.draft-item .meta .s b{color:var(--no);font-weight:600}
.draft-item .chev{color:var(--txt3);font-size:18px;flex:0 0 auto}

.badge-mini{
  display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;letter-spacing:.3px;vertical-align:middle;
}
.badge-mini.draft{background:rgba(200,145,39,.18);color:var(--ambar)}
.badge-mini.done{background:var(--ok-bg);color:var(--ok)}

.empty{text-align:center;padding:56px 30px;color:var(--txt3)}
.empty .big{font-size:50px;margin-bottom:14px;opacity:.6}
.empty h3{font-size:17px;color:var(--txt2);font-weight:650;margin-bottom:6px}
.empty p{font-size:14px;line-height:1.5}

/* ---------- Form ---------- */
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:650;color:var(--txt2);margin-bottom:7px;letter-spacing:.2px}
.field input,.field textarea,.field select{
  width:100%;background:var(--bg2);border:1.5px solid var(--line);border-radius:var(--rs);
  padding:13px 14px;color:var(--txt);outline:none;transition:border-color .15s;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--ambar)}
.field textarea{resize:vertical;min-height:80px;line-height:1.45}
.field .hint{font-size:12px;color:var(--txt3);margin-top:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ---------- Ambiente list ---------- */
.amb-card{
  display:flex;align-items:center;gap:13px;padding:14px 15px;width:100%;text-align:left;
  border-bottom:1px solid var(--line);transition:background .15s;background:var(--bg2);
}
.amb-card:last-child{border-bottom:none}
.amb-card:active{background:var(--bg3)}
.amb-card .ai{
  width:46px;height:46px;border-radius:12px;flex:0 0 auto;font-size:23px;
  display:flex;align-items:center;justify-content:center;background:var(--bg3);
}
.amb-card .am{flex:1;min-width:0}
.amb-card .am .an{font-size:16px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amb-card .am .ad{font-size:12.5px;color:var(--txt2);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.amb-card .am .ad .nc{color:var(--no);font-weight:650}
.amb-card .am .ad .cc{color:var(--ok);font-weight:600}
.amb-card .am .ad .fg-falta{color:var(--ambar);font-weight:650}
.amb-card .am .ad .fg-ok{color:var(--txt3);font-weight:500}
.amb-card .prog{
  flex:0 0 auto;font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;
  background:var(--bg3);color:var(--txt2);
}
.amb-card .prog.full{background:var(--ok-bg);color:var(--ok)}
.amb-card .chev{color:var(--txt3);font-size:18px;flex:0 0 auto}

.add-strip{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:15px;width:100%;color:var(--ambar);font-weight:650;font-size:15px;
  border:1.5px dashed var(--line);border-radius:var(--r);margin-top:12px;transition:.15s;
}
.add-strip:active{background:var(--bg2);border-color:var(--ambar)}

/* ---------- Checklist item ---------- */
.item{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.item .ihead{padding:14px 15px 12px}
.ititle-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px}
.item .ititle{font-size:15.5px;font-weight:600;line-height:1.35;flex:1}
.item-menu{
  width:30px;height:30px;flex:0 0 auto;border-radius:8px;background:var(--bg3);
  color:var(--txt2);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;
  margin-top:-2px;
}
.item-menu:active{background:var(--line)}
.item .ititle .num{color:var(--txt3);font-weight:700;margin-right:7px}
.status-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.st-btn{
  padding:11px 4px;border-radius:var(--rs);font-size:13px;font-weight:700;letter-spacing:.2px;
  border:1.5px solid var(--line);background:var(--bg3);color:var(--txt2);transition:.12s;text-align:center;
}
.st-btn:active{transform:scale(.97)}
.st-btn.sel.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.st-btn.sel.no{background:var(--no-bg);border-color:var(--no);color:var(--no)}
.st-btn.sel.na{background:var(--na-bg);border-color:var(--na);color:var(--na)}

.item .ibody{padding:0 15px 14px;border-top:1px solid var(--line);margin-top:0;animation:expand .2s ease}
@keyframes expand{from{opacity:0}to{opacity:1}}
.item .ibody .obs{margin-top:13px}
.item .ibody .obs textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:var(--rs);padding:11px 12px;color:var(--txt);outline:none;resize:vertical;min-height:62px;font-size:14.5px;line-height:1.4}
.item .ibody .obs textarea:focus{border-color:var(--ambar)}
.item .ibody .obs .lbl{font-size:12px;font-weight:650;color:var(--txt2);margin-bottom:6px;display:flex;align-items:center;gap:6px}

/* photos in item */
.photos-block{margin-top:14px}
.photos-block .lbl{font-size:12px;font-weight:650;color:var(--no);margin-bottom:9px;display:flex;align-items:center;gap:6px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo-thumb{position:relative;aspect-ratio:1;border-radius:var(--rs);overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-thumb .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.82));padding:14px 6px 5px;font-size:9.5px;color:#fff;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo-thumb .del{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1}
.photo-thumb .nocap{color:var(--ambar)}
.add-photo{
  aspect-ratio:1;border-radius:var(--rs);border:1.5px dashed var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--ambar);font-size:12px;font-weight:600;background:var(--bg);transition:.15s;
}
.add-photo:active{background:var(--bg3)}

/* fotos gerais do ambiente */
.gerais-box{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:18px}
.gerais-box.pend{border-color:rgba(200,145,39,.5)}
.gerais-box.ok{border-color:rgba(74,140,94,.45)}
.gerais-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.gerais-head .gh-t{font-size:15px;font-weight:700}
.gerais-head .gh-badge{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px}
.gerais-head .gh-badge.pend{background:rgba(200,145,39,.18);color:var(--ambar)}
.gerais-head .gh-badge.ok{background:var(--ok-bg);color:var(--ok)}
.gerais-sub{font-size:12.5px;color:var(--txt2);margin-top:5px;line-height:1.4}
.gerais-warn{font-size:12.5px;color:var(--ambar);font-weight:600;margin-top:10px;display:flex;align-items:center;gap:6px}
.gerais-warn::before{content:'⚠';font-size:14px}
.add-photo .pic{font-size:24px}

/* ---------- Normas técnicas ---------- */
.norma-q{font-size:14.5px;color:var(--txt2);line-height:1.45;margin:2px 4px 12px}
.norma-toggle{display:flex;gap:10px}
.ntg{
  flex:1;padding:14px;border-radius:var(--rs);font-size:15px;font-weight:700;
  border:1.5px solid var(--line);background:var(--bg3);color:var(--txt2);transition:.12s;
}
.ntg:active{transform:scale(.98)}
.ntg.on{background:rgba(200,145,39,.16);border-color:var(--ambar);color:var(--ambar)}
.norma-empty{
  font-size:13.5px;color:var(--txt3);text-align:center;padding:16px 12px;
  border:1.5px dashed var(--line);border-radius:var(--r);margin-top:10px;line-height:1.5;
}
.norma-sel{padding:14px 15px;border-bottom:1px solid var(--line)}
.norma-sel:last-child{border-bottom:none}
.norma-sel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.norma-sel-t{font-size:15px;font-weight:700;line-height:1.3;flex:1}
.norma-sel-x{
  width:26px;height:26px;border-radius:50%;background:var(--bg3);color:var(--no);
  font-size:17px;line-height:1;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
}
.norma-sel-txt{font-size:13px;color:var(--txt2);line-height:1.5;margin:8px 0 10px;white-space:pre-wrap}
.norma-obs{
  width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:var(--rs);
  padding:10px 12px;color:var(--txt);outline:none;resize:vertical;min-height:54px;font-size:14px;line-height:1.4;
}
.norma-obs:focus{border-color:var(--ambar)}
.norma-pick-list{display:flex;flex-direction:column;gap:8px}
.norma-pick{
  display:flex;align-items:flex-start;gap:12px;padding:14px;text-align:left;
  border:1.5px solid var(--line);border-radius:var(--r);background:var(--bg3);transition:.12s;
}
.norma-pick:active{transform:scale(.99)}
.norma-pick.sel{border-color:var(--ambar);background:rgba(200,145,39,.1)}
.np-check{
  width:24px;height:24px;border-radius:7px;flex:0 0 auto;border:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:#1b1c1b;font-size:15px;font-weight:800;background:var(--bg2);
}
.norma-pick.sel .np-check{background:var(--ambar);border-color:var(--ambar)}
.np-body{flex:1;min-width:0}
.np-t{font-size:14.5px;font-weight:700;line-height:1.3}
.np-x{font-size:12.5px;color:var(--txt2);line-height:1.4;margin-top:4px}
.norma-lib-item{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.norma-lib-item:last-child{border-bottom:none}
.nli-body{flex:1;min-width:0;padding:14px 15px}
.nli-body:active{background:var(--bg3)}
.nli-t{font-size:15px;font-weight:700;line-height:1.3}
.nli-x{font-size:12.5px;color:var(--txt2);line-height:1.45;margin-top:5px}
.nli-del{
  width:54px;flex:0 0 auto;color:var(--no);font-size:17px;border-left:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
}
.nli-del:active{background:var(--bg3)}

/* ---------- Bottom action bar ---------- */
.bottombar{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  max-width:520px;margin:0 auto;
  padding:12px 16px calc(12px + var(--safe-b));
  background:linear-gradient(transparent,rgba(237,235,232,.96) 22%);
  pointer-events:none;
}
.bottombar > *{pointer-events:auto}
.btn{
  width:100%;padding:16px;border-radius:14px;font-size:16px;font-weight:700;letter-spacing:.2px;
  display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .1s,opacity .15s;
}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--ambar);color:#1b1c1b}
.btn-dark{background:var(--bg3);color:var(--txt);border:1.5px solid var(--line)}
.btn-ghost{background:transparent;color:var(--txt2);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}

/* ---------- Modal / sheet ---------- */
.sheet-backdrop{
  position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);
  display:flex;align-items:flex-end;justify-content:center;
  animation:bdfade .2s ease;
}
@keyframes bdfade{from{opacity:0}to{opacity:1}}
.sheet{
  background:var(--bg2);width:100%;max-width:520px;
  border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  padding:8px 18px calc(20px + var(--safe-b));
  animation:slideup .28s cubic-bezier(.2,.9,.25,1);max-height:88vh;overflow-y:auto;
}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.sheet .grab{width:38px;height:4px;border-radius:3px;background:var(--line);margin:8px auto 16px}
.sheet h3{font-size:18px;font-weight:700;margin-bottom:4px}
.sheet .desc{font-size:13.5px;color:var(--txt2);margin-bottom:18px;line-height:1.45}

.amb-pick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:8px}
.amb-opt{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;
  border:1.5px solid var(--line);border-radius:var(--r);background:var(--bg3);transition:.12s;text-align:center;
}
.amb-opt:active{transform:scale(.96);border-color:var(--ambar)}
.amb-opt .e{font-size:28px}
.amb-opt .n{font-size:13px;font-weight:600;line-height:1.2}

/* confirm dialog */
.dialog{
  background:var(--bg2);width:100%;max-width:380px;margin:auto;border-radius:18px;
  border:1px solid var(--line);padding:24px 22px;animation:pop .22s cubic-bezier(.2,.9,.25,1);
}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.dialog-wrap{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.62);display:flex;padding:24px;animation:bdfade .2s}
.dialog h3{font-size:18px;font-weight:700;margin-bottom:8px}
.dialog p{font-size:14.5px;color:var(--txt2);line-height:1.5;margin-bottom:22px}
.dialog .dbtns{display:flex;gap:10px}
.dialog .dbtns button{flex:1;padding:13px;border-radius:11px;font-weight:700;font-size:15px}
.dialog .dbtns .cancel{background:var(--bg3);color:var(--txt)}
.dialog .dbtns .confirm{background:var(--no);color:#fff}
.dialog .dbtns .confirm.amber{background:var(--ambar);color:#1b1c1b}

/* rename input sheet */
.rename-input{
  width:100%;background:var(--bg);border:1.5px solid var(--ambar);border-radius:var(--rs);
  padding:14px;color:var(--txt);font-size:17px;outline:none;margin-bottom:16px;text-align:center;font-weight:600;
}

/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%) translateY(20px);
  background:#0e0f0e;border:1px solid var(--line);color:var(--txt);
  padding:12px 20px;border-radius:24px;font-size:14px;font-weight:600;
  z-index:80;opacity:0;transition:.25s;pointer-events:none;max-width:88%;text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,.5);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{border-color:var(--ok)}
#toast.err{border-color:var(--no)}

/* ---------- FAB ---------- */
.fab{
  position:fixed;right:max(18px,calc(50% - 260px + 18px));bottom:calc(22px + var(--safe-b));z-index:46;
  width:60px;height:60px;border-radius:50%;background:var(--ambar);color:#1b1c1b;
  display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:300;
  box-shadow:0 6px 22px rgba(200,145,39,.4);transition:transform .12s;
}
.fab:active{transform:scale(.92)}

/* progress summary bar on ambiente screen */
.sumbar{
  display:flex;gap:10px;margin-bottom:4px;
}
.sumbar .sx{
  flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;
}
.sumbar .sx .v{font-size:22px;font-weight:800;line-height:1}
.sumbar .sx .l{font-size:11px;color:var(--txt2);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.sumbar .sx.no .v{color:var(--no)}
.sumbar .sx.ok .v{color:var(--ok)}
.sumbar .sx.pend .v{color:var(--ambar)}

/* loading overlay */
.loading{
  position:fixed;inset:0;z-index:90;background:rgba(237,235,232,.95);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
}
.loading .spin{width:48px;height:48px;border:4px solid var(--line);border-top-color:var(--ambar);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading .msg{font-size:15px;color:var(--txt2);font-weight:600}

/* offline banner */
.offbar{
  position:fixed;top:calc(var(--safe-t));left:0;right:0;z-index:90;
  background:var(--no);color:#fff;text-align:center;padding:7px;font-size:13px;font-weight:600;
}

/* small note card */
.note-card{
  background:var(--bg2);border:1px solid var(--line);border-left:3px solid var(--ambar);
  border-radius:10px;padding:13px 15px;font-size:13.5px;color:var(--txt2);line-height:1.5;margin-top:14px;
}
.note-card b{color:var(--txt)}

.foot-credit{text-align:center;font-size:11px;color:var(--txt3);padding:24px 0 8px;letter-spacing:.3px}

/* ---------- Login ---------- */
.login-wrap{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px calc(24px + var(--safe-b));gap:20px;
}
.login-card{
  width:100%;max-width:360px;background:var(--bg2);border:1px solid var(--line);
  border-radius:20px;padding:34px 26px;text-align:center;
  animation:fade .3s ease;
}
.login-logo-img{
  width:100%;max-width:240px;height:auto;display:block;margin:0 auto 22px;
}
.login-t{font-size:20px;font-weight:700;letter-spacing:-.3px}
.login-s{font-size:13px;color:var(--txt2);margin-top:6px;margin-bottom:24px}
.login-input{
  width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;
  padding:15px 16px;color:var(--txt);outline:none;font-size:16px;text-align:center;transition:border-color .15s;
}
.login-input:focus{border-color:var(--ambar)}
.login-err{font-size:13px;color:var(--no);margin-top:12px;font-weight:600}
.login-foot{font-size:12px;color:var(--txt3);letter-spacing:.3px}
.install-hint{
  width:100%;max-width:360px;background:var(--bg2);border:1px solid var(--line);
  border-left:3px solid var(--ambar);border-radius:12px;padding:15px 17px;text-align:left;
}

   já foi semeada, marque ATUALIZAR_NORMAS_PADRAO = true (abaixo)
   para forçar a re-gravação dos textos padrão no aparelho.
   ============================================================ */
const NORMAS_PADRAO = [
  // Exemplo (pode apagar ou editar):
  // {
  //   id:'std_nbr15575_pisos',
  //   titulo:'NBR 15575 — Desempenho de pisos',
  //   texto:'Constatou-se desconformidade quanto aos requisitos de desempenho previstos na ABNT NBR 15575, no que se refere a...'
  // },
];

/* Se true, regrava os textos das NORMAS_PADRAO no aparelho mesmo que
   já tenham sido semeadas antes (use ao alterar um texto padrão). */
const ATUALIZAR_NORMAS_PADRAO = false;

/* Semeia as normas padrão na biblioteca local (sem duplicar). */
async function seedNormasPadrao(){
  if(!Array.isArray(NORMAS_PADRAO) || NORMAS_PADRAO.length===0) return;
  try{
    const existentes=await normasAll();
    const idsExistentes=new Set(existentes.map(n=>n.id));
    for(const n of NORMAS_PADRAO){
      if(!n.id || !n.titulo || !n.texto) continue;
      if(!idsExistentes.has(n.id) || ATUALIZAR_NORMAS_PADRAO){
        await normaPut({ id:n.id, titulo:n.titulo, texto:n.texto, updatedAt:Date.now(), origem:'padrao' });
      }
    }
  }catch(e){ console.warn('seed normas fail',e); }
}

/* ============================================================
   IndexedDB layer
   ============================================================ */
const DB_NAME='mg_vistoria_apto', DB_VER=2, STORE='vistorias', STORE_NORMAS='normas';
let _db=null;

function openDB(){
  return new Promise((res,rej)=>{
    if(_db) return res(_db);
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(STORE)){
        const os=db.createObjectStore(STORE,{keyPath:'id'});
        os.createIndex('updatedAt','updatedAt');
      }
      if(!db.objectStoreNames.contains(STORE_NORMAS)){
        db.createObjectStore(STORE_NORMAS,{keyPath:'id'});
      }
    };
    req.onsuccess=e=>{_db=e.target.result;res(_db)};
    req.onerror=e=>rej(e.target.error);
  });
}
async function dbPut(obj){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put(obj);
    tx.oncomplete=()=>res(true);
    tx.onerror=e=>rej(e.target.error);
  });
}
async function dbGet(id){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readonly');
    const r=tx.objectStore(STORE).get(id);
    r.onsuccess=()=>res(r.result||null);
    r.onerror=e=>rej(e.target.error);
  });
}
async function dbAll(){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readonly');
    const r=tx.objectStore(STORE).getAll();
    r.onsuccess=()=>res(r.result||[]);
    r.onerror=e=>rej(e.target.error);
  });
}
async function dbDel(id){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete=()=>res(true);
    tx.onerror=e=>rej(e.target.error);
  });
}

/* ---- biblioteca de normas técnicas (global, reutilizável) ---- */
async function normasAll(){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE_NORMAS,'readonly');
    const r=tx.objectStore(STORE_NORMAS).getAll();
    r.onsuccess=()=>res(r.result||[]);
    r.onerror=e=>rej(e.target.error);

}
async function normaPut(obj){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE_NORMAS,'readwrite');
    tx.objectStore(STORE_NORMAS).put(obj);
    tx.oncomplete=()=>res(true);

}
async function normaDel(id){

/* auto-expire finalized reports after 7 days */
async function purgeExpired(){
  try{
    const all=await dbAll();
    const now=Date.now(), WEEK=7*24*60*60*1000;
    for(const v of all){
      if(v.status==='finalizado' && v.finalizedAt && (now - v.finalizedAt > WEEK)){
        await dbDel(v.id);
      }
    }
  }catch(e){ console.warn('purge fail',e); }
}

/* retrocompat: garante os campos de normas em vistorias antigas */
function ensureNormas(v){
  if(typeof v.temNormas==='undefined') v.temNormas=null;
  if(!Array.isArray(v.normasSel)) v.normasSel=[];
  return v;
}
function todayISO(){
  const d=new Date(); const z=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
}
function fmtDateBR(iso){
  if(!iso) return '';
  const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`;
}

/* numbering: when >1 ambiente shares a template key, number them 01,02... */
function renumber(v){
  const counts={};
  v.ambientes.forEach(a=>{ counts[a.tmplKey]=(counts[a.tmplKey]||0)+1; });
  const seen={};
  v.ambientes.forEach(a=>{
    const t=tmplByKey(a.tmplKey);
    if(counts[a.tmplKey]>1){
      seen[a.tmplKey]=(seen[a.tmplKey]||0)+1;
      // only auto-name if user hasn't given a custom name
      if(!a.custom) a.nome = `${t.nome} ${String(seen[a.tmplKey]).padStart(2,'0')}`;
    }else{
      if(!a.custom) a.nome = t.nome;
    }
    // mantém as legendas das fotos gerais coerentes com o nome atual
    if(Array.isArray(a.fotosGerais)) a.fotosGerais.forEach(p=>{ p.cap=legendaGeral(a); });
  });
}

function ambStats(a){
  const total=a.checklist.length;
  let nc=0, cf=0, na=0, done=0;
  a.checklist.forEach(it=>{
    if(it.status){done++;}
    if(it.status==='desconforme')nc++;
    else if(it.status==='conforme')cf++;
    else if(it.status==='na')na++;
  });
  return {total,done,nc,cf,na,full:done===total&&total>0};
}
function vistStats(v){
  let nc=0, total=0, done=0;
  v.ambientes.forEach(a=>{
    const s=ambStats(a); nc+=s.nc; total+=s.total; done+=s.done;
  });
  return {nc, total, done, ambientes:v.ambientes.length};
}

/* ============================================================
   Photo capture + compression
   ============================================================ */
function fileToCompressedJPEG(file, maxDim=1600, quality=0.7){
  return new Promise((res,rej)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let {width:w, height:h}=img;
        if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
        else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
        const cv=document.createElement('canvas');
        cv.width=w; cv.height=h;
        const ctx=cv.getContext('2d');
        ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        try{ res(cv.toDataURL('image/jpeg',quality)); }
        catch(err){ rej(err); }
      };
      img.onerror=()=>rej(new Error('img load'));
      img.src=e.target.result; // Data URI works on iOS Safari
    };
    reader.onerror=()=>rej(new Error('read fail'));
    reader.readAsDataURL(file);
  });
}

async function saveNorma(id){
  const titulo=document.getElementById('normaTit').value.trim();
  const texto=document.getElementById('normaTxt').value.trim();
  if(!titulo){ toast('Informe o título da norma','err'); return; }
  if(!texto){ toast('Informe o texto da norma','err'); return; }
  const norma={
    id: id || ('n_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)),
    titulo, texto, updatedAt:Date.now()
  };
  await normaPut(norma);
  // se já estava selecionada em alguma vistoria aberta, atualiza o snapshot
  if(App.current && Array.isArray(App.current.normasSel)){
    App.current.normasSel.forEach(n=>{
      if(n.normaId===norma.id){ n.titulo=norma.titulo; n.texto=norma.texto; }
    });
    await saveNow();
  }
  const s=document.getElementById('normaEditSheet'); if(s) s.remove();
  toast('Norma salva','ok');
  manageNormas();
}

function delNorma(id){
  confirmDialog('Excluir norma?','A norma será removida da biblioteca. Vistorias já finalizadas não são afetadas.','Excluir',async()=>{
    await normaDel(id);
    // remove das seleções da vistoria atual
    if(App.current && Array.isArray(App.current.normasSel)){
      App.current.normasSel=App.current.normasSel.filter(n=>n.normaId!==id);
      await saveNow();
    }
    toast('Norma excluída','ok');
    manageNormas();
  });
}

/* ---------- photo capture ---------- */
/* Shared camera opener. Calls onCapture(file) when a photo is taken. */
function openCamera(onCapture){
  const input=document.createElement('input');
  // Set attributes (not just JS props) — some mobile engines only honor the
  // real HTML attribute, and the order matters: type + accept + capture before
  // the element is interacted with. capture="environment" asks the OS to open
  // the rear camera directly instead of the file/gallery picker.
  input.setAttribute('type','file');
  input.setAttribute('accept','image/*');
  input.setAttribute('capture','environment');
  input.capture='environment';
  input.style.position='fixed';
  input.style.left='-9999px';
  document.body.appendChild(input);
  const cleanup=()=>{ if(input.parentNode) input.parentNode.removeChild(input); };
  input.onchange=()=>{
    const file=input.files[0];
    cleanup();
    if(file) onCapture(file);
  };
  // Safety: if user cancels the camera, onchange never fires — clean up the
  // orphan input once focus returns to the window.
  window.addEventListener('focus',function once(){
    setTimeout(()=>{ if(input.parentNode && !input.files.length) cleanup(); },800);
    window.removeEventListener('focus',once);
  });
  input.click();
}

    try{

      const it=findItem(itemId);
      it.photos.push({data, cap:''});

      setTimeout(()=>editCap(itemId, it.photos.length-1),250);
    }catch(e){
      console.error(e); hideLoading();
      toast('Não consegui processar a foto','err');
    }
  });
}

function renameAmb(){
  const a=getAmb();
  inputSheet('Renomear ambiente','Defina um nome personalizado para este ambiente.',a.nome,'Ex.: Quarto da Ana',(val)=>{
    if(!val.trim()) return;
    a.nome=val.trim(); a.custom=true;
    // atualiza as legendas automáticas das fotos gerais para o novo nome
    ensureFotosGerais(a).forEach(p=>{ p.cap=legendaGeral(a); });
    scheduleSave();
    renderChecklist();
  });
}
async function dupAmb(){
  const v=App.current, a=getAmb();
  const copy=JSON.parse(JSON.stringify(a));
  copy.id='amb_'+Math.random().toString(36).slice(2,9);
  copy.custom=false;
  // reset all evaluations on the duplicate (fresh checklist, keep structure)
  copy.checklist.forEach(it=>{ it.id='it_'+Math.random().toString(36).slice(2,9); it.status=null; it.obs=''; it.photos=[]; });
  copy.fotosGerais=[]; // cópia limpa: fotos gerais não são copiadas
  const idx=v.ambientes.findIndex(x=>x.id===a.id);
  v.ambientes.splice(idx+1,0,copy);
  renumber(v);
  await saveNow();
  App.activeAmb=copy.id;
  renderChecklist();
  toast('Ambiente duplicado','ok');
}
function delAmb(){
  const v=App.current, a=getAmb();
  confirmDialog('Remover ambiente?',`"${esc(a.nome)}" e todas as suas avaliações e fotos serão excluídos.`,'Remover',async()=>{
    const idx=v.ambientes.findIndex(x=>x.id===a.id);
    v.ambientes.splice(idx,1);
    renumber(v);
    await saveNow();
    goAmbientes();
    toast('Ambiente removido','ok');
  });
}

/* ============================================================
   Generic input sheet + confirm dialog
   ============================================================ */
function inputSheet(title,desc,value,placeholder,cb){
  const sheet=document.createElement('div');
  sheet.className='sheet-backdrop'; sheet.id='inSheet';
  sheet.innerHTML=`<div class="sheet" onclick="event.stopPropagation()">
    <div class="grab"></div>
    <h3>${esc(title)}</h3>
    <div class="desc">${esc(desc)}</div>
    <input class="rename-input" id="inSheetVal" value="${esc(value)}" placeholder="${esc(placeholder)}">
    <button class="btn btn-primary" onclick="window._inSheetOk()">Salvar</button>
  </div>`;
  sheet.onclick=()=>{ sheet.remove(); };
  document.body.appendChild(sheet);
  const inp=document.getElementById('inSheetVal');
  setTimeout(()=>{ inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); },100);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ window._inSheetOk(); } });
  window._inSheetOk=()=>{
    const val=inp.value;
    sheet.remove();
    cb(val);
  };
}

function confirmDialog(title,msg,confirmLabel,cb,amber){
  const d=document.createElement('div');
  d.className='dialog-wrap'; d.id='confDlg';
  d.innerHTML=`<div class="dialog" onclick="event.stopPropagation()">
    <h3>${esc(title)}</h3>
    <p style="white-space:pre-line">${esc(msg)}</p>
    <div class="dbtns">
      <button class="cancel" onclick="document.getElementById('confDlg').remove()">Cancelar</button>
      <button class="confirm ${amber?'amber':''}" onclick="window._confOk()">${esc(confirmLabel)}</button>
    </div>
  </div>`;
  d.onclick=()=>d.remove();
  document.body.appendChild(d);
  window._confOk=()=>{ d.remove(); cb(); };
}

/* ============================================================
   Loading overlay
   ============================================================ */
function showLoading(msg){
  hideLoading();
  const l=document.createElement('div');
  l.className='loading'; l.id='loadOv';
  l.innerHTML=`<div class="spin"></div><div class="msg">${esc(msg||'Processando…')}</div>`;
  document.body.appendChild(l);
}
function hideLoading(){ const l=document.getElementById('loadOv'); if(l) l.remove(); }

/* ============================================================
   FINALIZE → PDF
   ============================================================ */
function finalizeFlow(){
  const v=App.current;
  const s=vistStats(v);
  const pend=s.total-s.done;

  // BLOQUEIO: cada ambiente precisa de no mínimo 2 fotos gerais
  const incompletos=v.ambientes.filter(a=>ensureFotosGerais(a).length<MIN_FOTOS_GERAIS);
  if(incompletos.length>0){
    const lista=incompletos.map(a=>{
      const n=ensureFotosGerais(a).length;
      return `• ${a.nome} (${n}/${MIN_FOTOS_GERAIS})`;
    }).join('\n');
    confirmDialog(
      'Fotos gerais faltando',
      `Cada ambiente precisa de pelo menos ${MIN_FOTOS_GERAIS} fotos gerais antes de gerar o relatório.\n\nAmbientes incompletos:\n${lista}\n\nAbra cada ambiente e adicione as fotos que faltam.`,
      'Entendi',
      ()=>{ /* só fecha */ },
      true
    );
    // troca o rótulo do botão de cancelar pra ficar coerente (um botão só)
    const dlg=document.getElementById('confDlg');
    if(dlg){ const c=dlg.querySelector('.cancel'); if(c) c.style.display='none'; }
    return;
  }

  let msg=`Para cada ambiente serão geradas: capa do ambiente, fotos gerais e, em seguida, as desconformidades (quando houver).`;
  if(s.nc===0) msg+=`\n\nNenhuma desconformidade foi registrada — os ambientes aparecerão com suas fotos gerais e status conforme.`;
  if(pend>0) msg+=`\n\nHá ${pend} ${pend>1?'itens':'item'} ainda não avaliado(s).`;
  confirmDialog('Gerar relatório PDF?',msg,'Gerar PDF',async()=>{
    await saveNow();
    await generatePDF();
  },true);
}

/* ---- PDF generation (A4 portrait) ---- */
async function generatePDF(){
  if(!window.jspdf || !window.jspdf.jsPDF){
    toast('Biblioteca de PDF não carregou. Verifique a conexão.','err'); return;
  }
  showLoading('Gerando relatório…');
  await new Promise(r=>setTimeout(r,60));

  try{
    const {jsPDF}=window.jspdf;
    const W=210, H=297; // A4 mm
    const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const M=16; // margin

    const DARK=MG.grafite, GOLD=MG.ambar, CIM=MG.cimento;
    const v=App.current;
    const s=vistStats(v);

    // sanitize text for Latin-1 (helvetica)
    const safe=t=>(t==null?'':String(t)).replace(/[^\x00-\xFF]/g,'');
    function text(t,x,y,opts){ try{ doc.text(safe(t),x,y,opts||{}); }catch(e){ try{ doc.text('',x,y,opts||{});}catch(_){} } }

    /* ---------- COVER ---------- */
    // background
    doc.setFillColor(27,28,27); doc.rect(0,0,W,H,'F');
    // top gold band
    doc.setFillColor(...GOLD); doc.rect(0,0,W,6,'F');

    // logo block
    doc.setFillColor(...GOLD);
    doc.roundedRect(M,34,26,26,4,4,'F');
    doc.setTextColor(27,28,27); doc.setFont('helvetica','bold'); doc.setFontSize(17);
    text('MG',M+13,51,{align:'center'});

    doc.setTextColor(236,234,231); doc.setFont('helvetica','bold'); doc.setFontSize(15);
    text('MG PERÍCIAS',M+32,46);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(168,166,162);
    text('Engenharia diagnóstica e avaliações',M+32,53);

    // title
    doc.setTextColor(...GOLD); doc.setFont('helvetica','bold'); doc.setFontSize(11);
    text('RELATÓRIO DE VISTORIA',M,92);
    doc.setTextColor(236,234,231); doc.setFontSize(24);
    text('Recebimento de',M,104);
    text('Apartamento',M,116);

    // separator
    doc.setDrawColor(58,59,58); doc.setLineWidth(0.4); doc.line(M,126,W-M,126);

    // data table
    let dy=140;
    const rows=[
      ['Cliente', v.cliente||'—'],
      ['Prédio / Condomínio', v.predio||'—'],
      ['Apartamento', v.apto||'—'],
      ['Data da vistoria', fmtDateBR(v.data)||'—'],
      ['Número da ART', v.art||'—'],
    ];
    rows.forEach(r=>{
      doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(120,120,118);
      text(r[0].toUpperCase(),M,dy);
      doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(236,234,231);
      const lines=doc.splitTextToSize(safe(r[1]),W-2*M);
      text(lines[0],M,dy+7);
      dy+=18;
    });

    // summary chips at bottom
    const cy=H-72;
    doc.setDrawColor(58,59,58); doc.line(M,cy-8,W-M,cy-8);
    const chipW=(W-2*M-12)/3;
    const chips=[
      [String(s.ambientes),'Ambientes',[236,234,231]],
      [String(s.nc),'Desconformidades',[224,146,121]],
      [String(s.done),'Itens avaliados',[127,212,152]],
    ];
    chips.forEach((c,i)=>{
      const cx=M+i*(chipW+6);
      doc.setFillColor(35,36,35); doc.roundedRect(cx,cy,chipW,30,4,4,'F');
      doc.setTextColor(...c[2]); doc.setFont('helvetica','bold'); doc.setFontSize(22);
      text(c[0],cx+chipW/2,cy+15,{align:'center'});
      doc.setTextColor(150,148,145); doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
      text(c[1].toUpperCase(),cx+chipW/2,cy+24,{align:'center'});
    });

    // footer cover
    doc.setTextColor(110,108,104); doc.setFont('helvetica','normal'); doc.setFontSize(8);
    text(MG.email,M,H-22);
    text(MG.end,M,H-16);
    doc.setTextColor(...GOLD); doc.setFontSize(7.5);
    text('mgpericias.com.br',M,H-10);

    /* ---------- POR AMBIENTE: capa → fotos gerais → desconformidades ---------- */
    // Todos os ambientes entram (mesmo 100% conforme). Itens OK/N-A não são
    // listados individualmente; só as desconformidades aparecem como itens.

    // helper: desenha grade de fotos 2-por-linha a partir de uma posição,
    // quebrando página quando necessário. Retorna o novo Y.
    function drawPhotoGrid(photos, y, contLabel){
      const gap=6;
      const pw=(W-2*M-gap)/2;
      const ph=pw*0.72;
      let px=M, col=0;
      for(const p of photos){
        if(col===0 && y+ph+10>H-22){
          doc.addPage(); pageHeader(doc,W,M,contLabel,GOLD,DARK); y=44;
        }
        try{ doc.addImage(p.data,'JPEG',px,y,pw,ph); }catch(e){ /* skip */ }
        doc.setDrawColor(210,206,202); doc.setLineWidth(0.3); doc.rect(px,y,pw,ph);
        if(p.cap){
          doc.setFillColor(...DARK); doc.rect(px,y+ph-7,pw,7,'F');
          doc.setTextColor(255,255,255); doc.setFont('helvetica','normal'); doc.setFontSize(7.5);
          const cap=doc.splitTextToSize(safe(p.cap),pw-4)[0];
          text(cap,px+2,y+ph-2.3);
        }
        col++;
        if(col===2){ col=0; px=M; y+=ph+gap; }
        else{ px=M+pw+gap; }
      }
      if(col===1){ y+=ph+gap; } // fecha linha ímpar
      return y;
    }

    let ambNum=0;
    for(const a of v.ambientes){
      ambNum++;
      const t=tmplByKey(a.tmplKey);
      const st=ambStats(a);
      const ncItems=a.checklist.filter(it=>it.status==='desconforme');
      const fg=ensureFotosGerais(a);

      /* ----- CAPA DO AMBIENTE (página própria, fundo escuro) ----- */
      doc.addPage();
      doc.setFillColor(27,28,27); doc.rect(0,0,W,H,'F');
      doc.setFillColor(...GOLD); doc.rect(0,0,W,5,'F');
      // numeração grande
      doc.setTextColor(58,59,58); doc.setFont('helvetica','bold'); doc.setFontSize(120);
      text(String(ambNum).padStart(2,'0'), W-M, 120, {align:'right'});
      // rótulo
      doc.setTextColor(...GOLD); doc.setFont('helvetica','bold'); doc.setFontSize(11);
      text('AMBIENTE '+String(ambNum).padStart(2,'0'), M, 130);
      // nome do ambiente
      doc.setTextColor(236,234,231); doc.setFont('helvetica','bold'); doc.setFontSize(30);
      const nomeLines=doc.splitTextToSize(safe(a.nome), W-2*M);
      let ny=146;
      nomeLines.forEach(l=>{ text(l,M,ny); ny+=12; });
      // separador
      doc.setDrawColor(58,59,58); doc.setLineWidth(0.4); doc.line(M,ny+4,W-M,ny+4);
      // resumo do ambiente
      let sy=ny+18;
      const resumo=[
        ['Itens vistoriados', String(st.total)],
        ['Conformes', String(st.cf)],
        ['Desconformidades', String(st.nc)],
        ['Não se aplica', String(st.na)],
        ['Fotos gerais', String(fg.length)],
      ];
      resumo.forEach(r=>{
        doc.setTextColor(150,148,145); doc.setFont('helvetica','normal'); doc.setFontSize(10);
        text(r[0].toUpperCase(), M, sy);
        const cor = (r[0]==='Desconformidades' && st.nc>0) ? [224,146,121] : [236,234,231];
        doc.setTextColor(...cor); doc.setFont('helvetica','bold'); doc.setFontSize(13);
        text(r[1], W-M, sy, {align:'right'});
        doc.setDrawColor(45,46,45); doc.setLineWidth(0.3); doc.line(M,sy+4,W-M,sy+4);
        sy+=14;
      });
      // status geral
      sy+=6;
      const statusTxt = st.nc>0 ? `${st.nc} desconformidade(s) registrada(s)` : 'Nenhuma desconformidade registrada';
      const statusCor = st.nc>0 ? [224,146,121] : [127,212,152];
      doc.setFillColor(35,36,35); doc.roundedRect(M,sy,W-2*M,16,3,3,'F');
      // marcador colorido (desenhado — emojis não renderizam no jsPDF helvetica)
      doc.setFillColor(...statusCor); doc.circle(M+8,sy+8,2.2,'F');
      doc.setTextColor(...statusCor); doc.setFont('helvetica','bold'); doc.setFontSize(11);
      text(statusTxt, M+14, sy+10);

      /* ----- FOTOS GERAIS (página de conteúdo) ----- */
      doc.addPage();
      pageHeader(doc,W,M,'REGISTRO DO AMBIENTE',GOLD,DARK);
      let y=44;
      // faixa com nome do ambiente
      doc.setFillColor(...DARK); doc.roundedRect(M,y,W-2*M,12,3,3,'F');
      doc.setTextColor(...GOLD); doc.setFont('helvetica','bold'); doc.setFontSize(8);
      text('AMBIENTE '+String(ambNum).padStart(2,'0'),M+5,y+4.5);
      doc.setTextColor(255,255,255); doc.setFontSize(11);
      text(a.nome,M+5,y+9.3);
      y+=18;
      doc.setTextColor(...DARK); doc.setFont('helvetica','bold'); doc.setFontSize(10);
      text('Fotos gerais', M, y); y+=6;
      if(fg.length){
        y=drawPhotoGrid(fg, y, 'REGISTRO DO AMBIENTE (cont.)');
      }else{
        doc.setFont('helvetica','italic'); doc.setFontSize(9.5); doc.setTextColor(120,120,120);
        text('(sem fotos gerais)', M, y); y+=8;
      }

      /* ----- DESCONFORMIDADES DO AMBIENTE ----- */
      if(ncItems.length>0){
        y+=4;
        if(y>H-40){ doc.addPage(); pageHeader(doc,W,M,'DESCONFORMIDADES',GOLD,DARK); y=44; }
        // título da seção
        doc.setDrawColor(...GOLD); doc.setLineWidth(0.5); doc.line(M,y,W-M,y); y+=7;
        doc.setTextColor(192,86,63); doc.setFont('helvetica','bold'); doc.setFontSize(12);
        text(`Desconformidades — ${ncItems.length} item(ns)`, M, y); y+=9;

        let ncCount=0;
        for(const it of ncItems){
          ncCount++;
          const obsLines=it.obs?doc.splitTextToSize(safe(it.obs),W-2*M-14):[];
          let blockH=16 + obsLines.length*5 + 6;
          if(y+blockH>H-24){ doc.addPage(); pageHeader(doc,W,M,'DESCONFORMIDADES',GOLD,DARK); y=44; }

          // número
          doc.setFillColor(...DARK); doc.circle(M+5,y+5,4,'F');
          doc.setTextColor(...GOLD); doc.setFont('helvetica','bold'); doc.setFontSize(9);
          text(String(ncCount),M+5,y+6.5,{align:'center'});
          // texto do item
          doc.setTextColor(...DARK); doc.setFont('helvetica','bold'); doc.setFontSize(10.5);
          const itLines=doc.splitTextToSize(safe(it.txt),W-2*M-14);
          let ity=y+4;
          itLines.forEach(l=>{ text(l,M+13,ity); ity+=5; });
          y=Math.max(y+12, ity+1);
          // observação
          if(obsLines.length){
            doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(70,70,70);
            obsLines.forEach(l=>{ text(l,M+13,y); y+=5; });
          }
          y+=2;
          // fotos da desconformidade (2 por linha)
          if(it.photos.length){
            y=drawPhotoGrid(it.photos, y, 'DESCONFORMIDADES (cont.)');
          }
          y+=4;
          doc.setDrawColor(232,228,224); doc.setLineWidth(0.3); doc.line(M,y-1,W-M,y-1);
          y+=4;
        }
      }
    }

    /* ---------- SEÇÃO FINAL: DESCONFORMIDADES COM NORMAS TÉCNICAS ---------- */
    // Só aparece se o usuário marcou "Sim" E selecionou ao menos uma norma.
    ensureNormas(v);
    if(v.temNormas===true && v.normasSel.length>0){
      // capa da seção (página escura)
      doc.addPage();
      doc.setFillColor(27,28,27); doc.rect(0,0,W,H,'F');
      doc.setFillColor(...GOLD); doc.rect(0,0,W,5,'F');
      doc.setTextColor(...GOLD); doc.setFont('helvetica','bold'); doc.setFontSize(11);
      text('SEÇÃO COMPLEMENTAR', M, 120);
      doc.setTextColor(236,234,231); doc.setFont('helvetica','bold'); doc.setFontSize(26);
      const tituloSec=doc.splitTextToSize('Desconformidades com normas técnicas', W-2*M);
      let ty=136; tituloSec.forEach(l=>{ text(l,M,ty); ty+=11; });
      doc.setDrawColor(58,59,58); doc.setLineWidth(0.4); doc.line(M,ty+4,W-M,ty+4);
      doc.setTextColor(150,148,145); doc.setFont('helvetica','normal'); doc.setFontSize(11);
      text(`${v.normasSel.length} norma(s) relacionada(s) neste apartamento`, M, ty+16);

      // páginas de conteúdo
      doc.addPage();
      pageHeader(doc,W,M,'NORMAS TÉCNICAS',GOLD,DARK);
      let y=44;
      let nNum=0;
      for(const n of v.normasSel){
        nNum++;
        // estimativa de altura do bloco
        const titLines=doc.splitTextToSize(safe(n.titulo), W-2*M-14);
        const txtLines=doc.splitTextToSize(safe(n.texto), W-2*M-4);
        const obsLines=n.obs?doc.splitTextToSize(safe(n.obs), W-2*M-8):[];
        const blockH = 10 + titLines.length*6 + 4 + txtLines.length*5 + (obsLines.length?(8+obsLines.length*5):0) + 12;
        if(y+blockH>H-22 && y>44){ doc.addPage(); pageHeader(doc,W,M,'NORMAS TÉCNICAS (cont.)',GOLD,DARK); y=44; }

        // número + título
        doc.setFillColor(...DARK); doc.circle(M+5,y+5,4,'F');
        doc.setTextColor(...GOLD); doc.setFont('helvetica','bold'); doc.setFontSize(9);
        text(String(nNum),M+5,y+6.5,{align:'center'});
        doc.setTextColor(...DARK); doc.setFont('helvetica','bold'); doc.setFontSize(12);
        let yy=y+4;
        titLines.forEach(l=>{ text(l,M+13,yy); yy+=6; });
        y=Math.max(y+12, yy+1);

        // texto fixo
        doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(55,55,55);
        txtLines.forEach(l=>{
          if(y>H-24){ doc.addPage(); pageHeader(doc,W,M,'NORMAS TÉCNICAS (cont.)',GOLD,DARK); y=44; }
          text(l,M,y); y+=5;
        });

        // observação do apto (se houver) — bloco destacado
        if(obsLines.length){
          y+=3;
          if(y+obsLines.length*5+6>H-22){ doc.addPage(); pageHeader(doc,W,M,'NORMAS TÉCNICAS (cont.)',GOLD,DARK); y=44; }
          const boxTop=y-2;
          doc.setFillColor(247,243,235);
          doc.roundedRect(M,boxTop,W-2*M,obsLines.length*5+8,2,2,'F');
          doc.setFillColor(...GOLD); doc.rect(M,boxTop,2.2,obsLines.length*5+8,'F');
          doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(...DARK);
          text('OBSERVAÇÃO',M+6,boxTop+5);
          doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(70,70,70);
          let oy=boxTop+10;
          obsLines.forEach(l=>{ text(l,M+6,oy); oy+=5; });
          y=oy+3;
        }

        y+=6;
        doc.setDrawColor(...GOLD); doc.setLineWidth(0.3); doc.line(M,y-3,W-M,y-3);
        y+=4;
      }
    }

    // page numbers + footer on every page except cover
    const total=doc.internal.getNumberOfPages();
    for(let p=2;p<=total;p++){
      doc.setPage(p);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(150,150,148);
      text(`MG PERÍCIAS · ${v.predio||v.cliente||'Vistoria'}${v.apto?' · Apto '+v.apto:''}`,M,H-8);
      text(`${p-1}`,W-M,H-8,{align:'right'});
    }

    hideLoading();

    // finalize the vistoria
    if(v.status!=='finalizado'){
      v.status='finalizado'; v.finalizedAt=Date.now();
      await saveNow();
    }

    // save / share
    const fileName=`Vistoria_${(v.predio||v.cliente||'apto').replace(/[^a-zA-Z0-9]/g,'_')}${v.apto?'_'+v.apto:''}.pdf`;
    const blob=doc.output('blob');
    await sharePDF(blob,fileName,doc);

  }catch(e){
    console.error(e); hideLoading();
    toast('Erro ao gerar PDF: '+(e.message||e),'err');
  }
}

function pageHeader(doc,W,M,label,GOLD,DARK){
  doc.setFillColor(255,255,255); doc.rect(0,0,W,297,'F');
  doc.setFillColor(...GOLD); doc.rect(0,0,W,5,'F');
  // mini brand
  doc.setFillColor(...GOLD); doc.roundedRect(M,12,16,16,3,3,'F');
  doc.setTextColor(27,28,27); doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('MG',M+8,22.5,{align:'center'});
  doc.setTextColor(...DARK); doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('MG PERÍCIAS',M+20,20);
  doc.setTextColor(...GOLD); doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text(label, W-M, 20, {align:'right'});
  doc.setDrawColor(...GOLD); doc.setLineWidth(0.5); doc.line(M,32,W-M,32);
}

/* ---- share / download PDF ---- */
async function sharePDF(blob,fileName,doc){
  const file=new File([blob],fileName,{type:'application/pdf'});
  // try native share (mobile)
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:fileName});
      toast('Relatório finalizado','ok');
      goList();
      return;
    }catch(e){
      if(e.name==='AbortError'){ goList(); return; }
      // fall through to download
    }
  }
  // fallback: download
  try{
    doc.save(fileName);
  }catch(e){
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=fileName; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  toast('PDF gerado e baixado','ok');
  goList();
}

/* ============================================================
   Offline awareness
   ============================================================ */
function updateOnline(){
  let bar=document.getElementById('offbar');
  if(!navigator.onLine){
    if(!bar){
      bar=document.createElement('div'); bar.id='offbar'; bar.className='offbar';
      bar.textContent='Sem conexão — o app continua funcionando, dados salvos no aparelho';
      document.body.appendChild(bar);
    }
  }else{
    if(bar) bar.remove();
  }
}
window.addEventListener('online',updateOnline);
window.addEventListener('offline',updateOnline);

/* ============================================================
   Boot
   ============================================================ */
(async function boot(){
  try{ await openDB(); await purgeExpired(); await seedNormasPadrao(); }
  catch(e){ console.error('DB init',e); }
  updateOnline();
  if(isAuthed()) goList();
  else renderLogin();
})();
